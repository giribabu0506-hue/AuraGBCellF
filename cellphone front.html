<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>AuraGB Keypad Phone</title>

<style>
body{
    margin:0;
    background:#111;
    font-family:Arial;
    color:white;
}

agb-phone{
    width:320px;
    height:520px;
    margin:20px auto;
    background:#1b1b1b;
    border-radius:20px;
    padding:10px;
    box-sizing:border-box;
    border:4px solid #444;
}

agb-status{
    display:flex;
    justify-content:space-between;
    font-size:14px;
    padding:5px;
    background:#222;
    border-radius:10px;
}

agb-screen{
    height:180px;
    margin-top:10px;
    background:black;
    border-radius:10px;
    padding:15px;
    box-sizing:border-box;
}

agb-title{
    display:block;
    font-size:24px;
    text-align:center;
    margin-bottom:15px;
}

agb-number{
    display:block;
    text-align:center;
    font-size:28px;
    color:#00ff88;
    margin-top:30px;
}

agb-menu{
    margin-top:20px;
}

agb-item{
    display:block;
    padding:8px;
    background:#222;
    margin-bottom:8px;
    border-radius:8px;
}

agb-keypad{
    margin-top:20px;
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
}

.agb-btn{
    height:55px;
    border:none;
    border-radius:12px;
    background:#333;
    color:white;
    font-size:22px;
}

.agb-btn:active{
    background:#00aa66;
}
</style>
</head>

<body>

<agb-phone>

    <agb-status>
        <span>4G</span>
        <span id="time"></span>
        <span>85%</span>
    </agb-status>

    <agb-screen>

        <agb-title>
            AuraGB Phone
        </agb-title>

        <agb-number id="number">
            _
        </agb-number>

        <agb-menu>
            <agb-item>Dialer</agb-item>
            <agb-item>Messages</agb-item>
            <agb-item>Contacts</agb-item>
        </agb-menu>

    </agb-screen>

    <agb-keypad>

        <button class="agb-btn" onclick="press('1')">1</button>
        <button class="agb-btn" onclick="press('2')">2</button>
        <button class="agb-btn" onclick="press('3')">3</button>

        <button class="agb-btn" onclick="press('4')">4</button>
        <button class="agb-btn" onclick="press('5')">5</button>
        <button class="agb-btn" onclick="press('6')">6</button>

        <button class="agb-btn" onclick="press('7')">7</button>
        <button class="agb-btn" onclick="press('8')">8</button>
        <button class="agb-btn" onclick="press('9')">9</button>

        <button class="agb-btn" onclick="press('*')">*</button>
        <button class="agb-btn" onclick="press('0')">0</button>
        <button class="agb-btn" onclick="press('#')">#</button>

    </agb-keypad>

</agb-phone>

<script>

let num="";

function press(v){

    num += v;

    document.getElementById("number").innerHTML=num;

}

setInterval(function(){

    let d=new Date();

    document.getElementById("time").innerHTML=
    d.getHours()+":"+String(d.getMinutes()).padStart(2,"0");

},1000);

</script>

</body>
</html>
